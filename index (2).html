<body>
<header>
<div class="brand"><span class="pmark" aria-label="PANLFY logo"><span class="p1"></span><span class="p2"></span><span class="p3"></span><span class="p4"></span></span><span class="wordmarkFixed">PANLFY</span></div>

<button class="choice layout" data-layout="2v"><span class="layoutIcon l2v"><i></i><i></i></span>2 Columns</button>

<input id="allFiles" type="file" accept="image/*" multiple><input id="oneFile" type="file" accept="image/*">
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),zoom=document.getElementById('zoom'),gap=document.getElementById('gap'),allFiles=document.getElementById('allFiles'),oneFile=document.getElementById('oneFile'),dividerColor=document.getElementById('dividerColor');let divider='#ffffff';
let ratio='9:16',layout='4h',sel=0,slots=[],drag=false,lx=0,ly=0,pointers=new Map(),pinch=null;
const blank=()=>({im:null,src:'',zoom:1,x:0,y:0});for(let i=0;i<8;i++)slots.push(blank());
let mediaLibrary=[];
let activeMediaSrc='';
const mediaStrip=document.getElementById('mediaStrip');
const mediaEmpty=document.getElementById('mediaEmpty');
const albumButton=document.getElementById('albumButton');
const albumMenu=document.getElementById('albumMenu');
const addMediaButton=document.getElementById('addMediaButton');
function cloneMedia(m){return {im:m.im,src:m.src,zoom:1,x:0,y:0}}
function addToMediaLibrary(item,name='Photo'){
  if(!item||!item.src)return;
  if(mediaLibrary.some(m=>m.src===item.src))return;
  mediaLibrary.unshift({im:item.im,src:item.src,name});
  renderMediaLibrary();
}

function renderMediaLibrary(){
  if(!mediaStrip)return;
  mediaStrip.querySelectorAll('.mediaThumb').forEach(el=>el.remove());
  mediaEmpty.classList.toggle('is-hidden',mediaLibrary.length>0);
  mediaLibrary.forEach((m,i)=>{
    const b=document.createElement('button');
    b.type='button';
    b.className='mediaThumb'+(m.src===activeMediaSrc?' selected':'');
    b.setAttribute('aria-label',m.name||('Photo '+(i+1)));
    const img=document.createElement('img');
    img.src=m.src;
    img.alt='';
    b.appendChild(img);
    b.onclick=()=>{
      slots[sel]=cloneMedia(m);
      activeMediaSrc=m.src;
      renderMediaLibrary();
      sync();
      draw();
    };
    mediaStrip.appendChild(b);
  });
}

function cells(){let W=cv.width,H=cv.height,g=+gap.value;
 if(layout==='2v')return[{x:0,y:0,w:(W-g)/2,h:H},{x:(W+g)/2,y:0,w:(W-g)/2,h:H}];
 if(layout==='2h')return[{x:0,y:0,w:W,h:(H-g)/2},{x:0,y:(H+g)/2,w:W,h:(H-g)/2}];
 if(layout==='4g'){let w=(W-g)/2,h=(H-g)/2;return[{x:0,y:0,w,h},{x:w+g,y:0,w,h},{x:0,y:h+g,w,h},{x:w+g,y:h+g,w,h}]}
 if(layout==='heroTop'){let bottomH=(H-g)/3,topH=H-g-bottomH,w=(W-g)/2;return[{x:0,y:0,w:W,h:topH},{x:0,y:topH+g,w,h:bottomH},{x:w+g,y:topH+g,w,h:bottomH}]}
 if(layout==='heroBottom'){let topH=(H-g)/3,bottomH=H-g-topH,w=(W-g)/2;return[{x:0,y:0,w,h:topH},{x:w+g,y:0,w,h:topH},{x:0,y:topH+g,w:W,h:bottomH}]}
 if(layout==='2x3'){let w=(W-g)/2,h=(H-g*2)/3,a=[];for(let r=0;r<3;r++)for(let col=0;col<2;col++)a.push({x:col*(w+g),y:r*(h+g),w,h});return a}
 if(layout==='2x4'){let w=(W-g)/2,h=(H-g*3)/4,a=[];for(let r=0;r<4;r++)for(let col=0;col<2;col++)a.push({x:col*(w+g),y:r*(h+g),w,h});return a}
 let h=(H-g*3)/4;return[0,1,2,3].map(i=>({x:0,y:i*(h+g),w:W,h}));
}
function setRatio(r){ratio=r;let [a,b]=r.split(':').map(Number);if(a/b>=1){cv.width=1920;cv.height=Math.round(1920*b/a)}else{cv.height=1920;cv.width=Math.round(1920*a/b)};draw();document.querySelectorAll('[data-ratio]').forEach(x=>x.classList.toggle('active',x.dataset.ratio===r))}
function fit(o,c){let base=Math.max(c.w/o.im.naturalWidth,c.h/o.im.naturalHeight),s=base*o.zoom,w=o.im.naturalWidth*s,h=o.im.naturalHeight*s,mx=Math.max(0,(w-c.w)/2),my=Math.max(0,(h-c.h)/2);o.x=Math.max(-mx,Math.min(mx,o.x));o.y=Math.max(-my,Math.min(my,o.y));return{w,h}}
function draw(select=true){ctx.fillStyle=divider;ctx.fillRect(0,0,cv.width,cv.height);let cs=cells();cs.forEach((c,i)=>{let o=slots[i]||blank();ctx.save();ctx.beginPath();ctx.rect(c.x,c.y,c.w,c.h);ctx.clip();if(o.im){let q=fit(o,c);ctx.drawImage(o.im,c.x+(c.w-q.w)/2+o.x,c.y+(c.h-q.h)/2+o.y,q.w,q.h)}else{ctx.fillStyle=document.body.classList.contains('light')?'#f4f6f8':'#171b20';ctx.fillRect(c.x,c.y,c.w,c.h);ctx.fillStyle=document.body.classList.contains('light')?'#8b95a3':'#707780';ctx.textAlign='center';ctx.font=`bold ${Math.max(24,cv.width/24)}px sans-serif`;ctx.fillText('+',c.x+c.w/2,c.y+c.h/2-10);ctx.font=`${Math.max(15,cv.width/50)}px sans-serif`;ctx.fillText('Tap to add photo',c.x+c.w/2,c.y+c.h/2+32)}ctx.restore();if(select&&i===sel){ctx.strokeStyle='#0b91ff';ctx.lineWidth=Math.max(4,cv.width/220);ctx.strokeRect(c.x+2,c.y+2,c.w-4,c.h-4)}})}
function sync(){zoom.value=Math.round((slots[sel]?.zoom||1)*100);document.getElementById('zv').textContent=zoom.value+'%'}
function pos(e){let r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}}
function hit(p){return Math.max(0,cells().findIndex(c=>p.x>=c.x&&p.x<=c.x+c.w&&p.y>=c.y&&p.y<=c.y+c.h))}
function read(f){return new Promise(res=>{let rd=new FileReader();rd.onload=e=>{let im=new Image();im.onload=()=>res({im,src:e.target.result,zoom:1,x:0,y:0});im.src=e.target.result};rd.readAsDataURL(f)})}
allFiles.onchange=async()=>{
  let fs=[...allFiles.files],n=cells().length,loaded=[];
  for(let i=0;i<fs.length;i++){
    let item=await read(fs[i]);
    loaded.push(item);
    addToMediaLibrary(item,fs[i].name||('Photo '+(mediaLibrary.length+1)));
  }
  for(let i=0;i<Math.min(loaded.length,n);i++)slots[i]=cloneMedia(loaded[i]);
  if(loaded[0])activeMediaSrc=loaded[0].src;
  renderMediaLibrary();
  draw();
  allFiles.value='';
};
oneFile.onchange=async()=>{
  if(oneFile.files[0]){
    let item=await read(oneFile.files[0]);
    slots[sel]=cloneMedia(item);
    addToMediaLibrary(item,oneFile.files[0].name||'Photo');
    activeMediaSrc=item.src;
    renderMediaLibrary();
  }
  draw();
  oneFile.value='';
};
const replaceBtn=document.getElementById('replace');
if(replaceBtn)replaceBtn.onclick=()=>oneFile.click();
const clearBtn=document.getElementById('clear');
if(clearBtn)clearBtn.onclick=()=>{slots[sel]=blank();draw()};
const resetBtn=document.getElementById('reset');
if(resetBtn)resetBtn.onclick=()=>{if(slots[sel]){slots[sel].zoom=1;slots[sel].x=slots[sel].y=0;sync();draw()}};
zoom.oninput=()=>{if(slots[sel])slots[sel].zoom=+zoom.value/100;document.getElementById('zv').textContent=zoom.value+'%';draw()};gap.oninput=()=>{document.getElementById('gv').textContent=gap.value+' px';draw()};
document.querySelectorAll('.swatch').forEach(b=>b.onclick=()=>{divider=b.dataset.color;dividerColor.value=divider;document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active'));b.classList.add('active');draw()});
dividerColor.oninput=()=>{divider=dividerColor.value;document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active'));draw()};
document.querySelectorAll('[data-ratio]').forEach(b=>b.onclick=()=>setRatio(b.dataset.ratio));document.querySelectorAll('[data-layout]').forEach(b=>b.onclick=()=>{
  const section=b.closest('.section');
  if(section){
    section.querySelectorAll('[data-layout]').forEach(x=>x.classList.remove('active'));
  }
  b.classList.add('active');
  layout=b.dataset.layout;
  sel=0;
  sync();
  draw();
});
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  document.querySelectorAll('.section').forEach(x=>x.classList.toggle('active',x.dataset.sec===b.dataset.tab));
  document.body.classList.toggle('media-open',b.dataset.tab==='media');
  if(b.dataset.tab==='media')renderMediaLibrary();
  albumMenu.classList.remove('open');
});

function sizeMediaTiles(){
  if(!mediaStrip)return;
  if(window.matchMedia('(max-width:699px)').matches){
    mediaStrip.style.removeProperty('--media-tile');
    return;
  }
  const cs=getComputedStyle(mediaStrip);
  const pt=parseFloat(cs.paddingTop)||0;
  const pb=parseFloat(cs.paddingBottom)||0;
  const gap=parseFloat(cs.rowGap)||7;
  const usable=mediaStrip.clientHeight-pt-pb-gap;
  const tile=Math.max(44,Math.floor(usable/2));
  mediaStrip.style.setProperty('--media-tile',tile+'px');
}
if(typeof ResizeObserver!=='undefined'){
  new ResizeObserver(()=>sizeMediaTiles()).observe(mediaStrip);
}else{
  window.addEventListener('resize',sizeMediaTiles);
}
requestAnimationFrame(sizeMediaTiles);


addMediaButton.onclick=()=>allFiles.click();
mediaEmpty.onclick=()=>allFiles.click();
albumButton.onclick=(e)=>{
  e.stopPropagation();
  albumMenu.classList.toggle('open');
};
albumMenu.querySelector('[data-album-action="recents"]').onclick=()=>{
  albumButton.innerHTML='Recents <span>⌄</span>';
  albumMenu.classList.remove('open');
};
albumMenu.querySelector('[data-album-action="photos"]').onclick=()=>{

};
document.addEventListener('click',(e)=>{
  if(!albumMenu.contains(e.target)&&e.target!==albumButton&&!albumButton.contains(e.target))albumMenu.classList.remove('open');
});
cv.onpointerdown=e=>{e.preventDefault();let p=pos(e);sel=hit(p);sync();pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(!slots[sel]?.im&&pointers.size===1){oneFile.click();return}if(pointers.size===1){drag=true;lx=e.clientX;ly=e.clientY}else if(pointers.size===2){let ps=[...pointers.values()];pinch={d:Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y),z:slots[sel].zoom};drag=false}draw()};
cv.onpointermove=e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2&&pinch){let ps=[...pointers.values()],d=Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y);slots[sel].zoom=Math.max(1,Math.min(3,pinch.z*d/pinch.d));sync();draw();return}if(drag&&slots[sel]?.im){let r=cv.getBoundingClientRect();slots[sel].x+=(e.clientX-lx)*cv.width/r.width;slots[sel].y+=(e.clientY-ly)*cv.height/r.height;lx=e.clientX;ly=e.clientY;draw()}};
cv.onpointerup=cv.onpointercancel=e=>{pointers.delete(e.pointerId);if(!pointers.size){drag=false;pinch=null}};
document.getElementById('share').onclick=()=>{if(cells().some((_,i)=>!slots[i]?.im)){alert('Add a photo to each panel first.');return}draw(false);cv.toBlob(async blob=>{try{let f=new File([blob],'panlfy-collage.jpg',{type:'image/jpeg'});if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[f]})))await navigator.share({files:[f],title:'PANLFY'});else{let u=URL.createObjectURL(blob);location.href=u}}catch(e){}finally{setTimeout(()=>draw(true),100)}},'image/jpeg',.98)};
setRatio('9:16');draw();
</script>

 function setTheme(mode){
   document.body.classList.toggle('light',mode==='light');
